name: Public comment index
on:
  discussion:
    types: [created, edited, deleted, transferred, category_changed]
  discussion_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: public-comment-index
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == '70ki8suda/portfolio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      discussions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Collect and validate complete snapshot
        run: npx tsx scripts/collect-comment-index.ts --output /tmp/annotations.json --source "$GITHUB_SHA" --generation "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: annotations
          path: /tmp/annotations.json*
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: annotations
          path: /tmp/comment-index
      - name: Validate artifact and advance only the dedicated branch
        run: npx tsx scripts/publish-comment-index.ts /tmp/comment-index/annotations.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
