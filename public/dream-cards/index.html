<script type="application/json" id="deck-data">{"cards": [{"title": "わが家から、つながりの中へ幸せを育てる", "date": "2029年11月26日の私 — 目標日の仮案", "body": ["私は家族と、緑と四季を身近に感じながら、穏やかに暮らしている。", "季節の食材を自分の手で料理し、食卓を囲む。散歩の途中で、花や風や光の変化に気づく。よく歩き、体を動かし、無理なく鍛えた体が毎日を支えている。予定を詰めすぎず、家族それぞれが好きなことを楽しむ時間がある。", "楽器を少しずつ深め、ジャズのコード進行やスケールが耳と手になじんでいる。豊かなテンションの響きを選び、自分の歌としてアドリブを奏でる。仲間と音を重ね、互いの演奏に耳を傾ける時間を楽しんでいる。", "仕事では、人が時間と自由を取り戻し、自然とともに暮らし、互いに支え合える社会に貢献している。その仕事から得る収入と、着実に築く資本が、暮らしの安心と選択の自由を支えている。", "仏教の考え方を学び続けている。すべては移り変わること、自分もまた多くの縁に支えられてここにいることを、暮らしの中で確かめている。思い通りにならないときも、ひと呼吸おいて、相手と自分の両方を思いやれるようになってきた。", "仕事で出会う人、音楽を楽しむ仲間、スポーツでともに汗を流す人。一期一会の縁を大切にし、目の前の人を知り、ともに過ごす時間を味わっている。再会を喜び、互いの挑戦を応援し、困ったときには助け合える関係が育っている。", "わが家の食卓や、演奏する場、体を動かす時間から、小さなコミュニティが生まれている。一人ひとりが自分らしくいられ、新しく出会う人も自然に加われる。料理や知恵や楽しみを分かち合うことで、幸せの輪が少しずつ広がっている。", "夢へ向かう一日一日のなかで、私は少しずつ誠実に、思いやり深くなっている。私が望む世界は、今日の暮らしと、目の前の人との関わりから育っている。"], "label": "わが家から"}, {"title": "穏やかさを、今日の予定に入れる。", "body": ["食事、散歩、音楽、休息の時間を先に確保する。余裕がなくなったら、減らせる予定を探す。結果を急がず、今日の歩みから学べたことを一つ見つける。"], "label": "穏やかさ"}, {"title": "食べることを、自分の手に取り戻す。", "body": ["無理なく続けられる頻度で自炊し、一食を丁寧に作って味わう。季節の食材を一つ取り入れる。"], "label": "食べること"}, {"title": "身近な自然の中で、体を動かす。", "body": ["短い散歩でも空や木々を見る。歩く、伸ばす、鍛えるなど、その日の体調に合った運動を続け、疲れた日は休む。四季の変化を家族と分かち合い、暮らしの中の緑を大切にする。"], "label": "身近な自然"}, {"title": "音楽は、小さな練習を積み重ねる。", "body": ["一つの進行、一つの響き、一つのフレーズに取り組む。学んだコードやスケールを、好きな曲の中で使って楽しむ。"], "label": "音楽"}, {"title": "家族それぞれの夢を聞く。", "body": ["自分の理想を話す時間と、相手の望みを聞く時間を持つ。暮らし方は一緒に決め、互いの一人の時間も守る。"], "label": "家族の夢"}, {"title": "お金を、安心と自由につなげる。", "body": ["生活費、収入、資産、働く時間を定期的に確認する。「どれだけあれば、望む暮らしを続けられるか」を基準にする。"], "label": "安心と自由"}, {"title": "仕事の選択に、望む社会への貢献を含める。", "body": ["誰の負担を減らせるか、誰の自立を支えられるか、自然への負荷を減らせるかを考える。小さくても、具体的な成果にする。"], "label": "仕事"}, {"title": "一期一会の縁を、心を込めて育てる。", "body": ["仕事でも趣味でも、相手の話に耳を傾け、感謝や楽しかった気持ちを言葉にする。また会いたい人には、自分から連絡する。互いに心地よい距離と頻度を大切にする。"], "label": "一期一会"}, {"title": "一緒に楽しむ、小さな場をつくる。", "body": ["食卓を囲む、音を合わせる、スポーツをする。身近な人を誘い、ときにはその人の仲間も迎える。自分も誰かの誘いに応じ、楽しみや手助けを持ち寄る。"], "label": "小さな場"}, {"title": "学びを、慈悲の実践に変える。", "body": ["諸行無常や諸法無我について少しずつ読み、変わっていくものや、縁に支えられている自分に気づき、固定した自分像にこだわらずに学ぶ。思い通りにならないときは、ひと呼吸おく。欲しい、勝ちたい、認められたいという気持ちに気づいたら、それに引かれすぎていないかを確かめる。相手と自分の苦しさに目を向け、できる手助けをする。感謝を伝え、困ったときは助けを求める。"], "label": "慈悲の実践"}], "roadmap": [{"date": "2026年12月26日", "body": "家族と望む暮らしを話す。生活費・収入・資産・働く時間を一枚にまとめる。自炊と散歩の時間を予定に入れ、無理なく続けられる運動を一つ選ぶ。練習したい一曲を選んで現在の演奏を録音する。仏教の考え方を学ぶ入門の本を一冊選び、読みはじめる。また会いたい人に連絡し、音楽やスポーツなど一緒に楽しめる機会を一つ予定に入れる。"}, {"date": "2027年11月26日", "body": "季節ごとの定番料理と散歩道がある。体を動かすことが暮らしの習慣になっている。好きな曲で、コードの構成音をつないだアドリブやテンションの響きを楽しめる。無常や無我について自分の言葉で話せるようになり、ひと呼吸おくことが身についてきている。必要な収入と資産の目標を自分の数字で定め、理想の社会に近づく仕事上の取り組みを一つ形にしている。顔なじみの仲間と、無理なく集まれる場がある。自分から誘うことも、誘われて参加することも日常になっている。"}, {"date": "2029年11月26日", "body": "夢カードの暮らしが日常になっている。家族との時間、音楽、社会への貢献を続けられる働き方と経済的な土台があり、身近な人との助け合いも育っている。健やかな体と、学びに支えられた落ち着きがある。家族、仕事、趣味を通じた小さなコミュニティが育ち、楽しみや助け合いが行き来している。新しい縁にも開かれている。"}], "usage": ["朝に夢カードを読み、今日大切にする行動を一つ選ぶ。月末には、できたことと暮らし心地、自分の心の変化を振り返り、次のひと月の予定を決める。", "今日は、誰との時間を大切にしようか。"]}</script><script>

function open(i){render(i);show('reading');document.getElementById('status').textContent=cards[i].label+'のカードを開きました';document.getElementById('card-detail').focus();}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));document.getElementById('dream').onclick=()=>open(0);
document.getElementById('draw').onclick=()=>{const pool=cards.map((_,i)=>i).filter(i=>i>0&&i!==selected&&i!==lastDraw);const i=pool[Math.floor(Math.random()*pool.length)];lastDraw=i;open(i)};
document.getElementById('grid').innerHTML=cards.map((c,i)=>'<button type="button" class="mini" data-card="'+i+'" aria-label="'+e(c.title)+'を読む"><span aria-hidden="true">'+front(i)+'</span><span class="caption">'+e(c.title)+'</span></button>').join('');document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>open(Number(b.dataset.card)));
document.getElementById('roadmap').innerHTML=data.roadmap.map(p=>'<article class="phase"><h3>'+e(p.date)+'</h3><p class="label">日付は仮案</p><p>'+e(p.body)+'</p></article>').join('');document.getElementById('usage').innerHTML='<h2>日々の使い方</h2>'+data.usage.map(t=>'<p>'+e(t)+'</p>').join('');render(0);
})();
</script></body></html>
