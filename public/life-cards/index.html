<script id="deck-data" type="application/json">{"title": "庭と網と輪と息 — ソーラーパンクな暮らしへ向かう16枚の問いのカード", "intro": "分散した共同体、エコロジー、仏教的な心の安寧。そこへ近づく暮らしを、月ごとの小さな実験と、年ごとの振り返りで確かめるためのカードです。未来を占うものでも、悟りや成功を約束するものでもありません。書いてあるのは問いと、やめてもよい小さな試みです。回数や達成は数えません。点の目標ではなく、方角を一つ決めるために引いてください。", "how_to_use": ["月のはじめに1枚引く。その月は「問い」を持ち歩き、「月の実践」を一度でも試せば十分。できなかった月は、何が妨げたかだけ覚えておく。", "年に一度、引いたカードを並べて「年の視点」を読み、何が続き、何が終わったかを見る。16番のカードは年の区切りに自分で選んで開いてもよい。", "「偏りの気づき」は、そのカードに熱心になりすぎたときの合図。当てはまったら、別の組のカードを引き直す。", "仕事、住まい、お金に関わる大きな変更は、このカードでは決めない。家計や家族の事情を知る人と、事実を並べて話すための材料として使う。"], "suits": [{"id": "soil", "name": "土と手", "theme": "生態と手入れ"}, {"id": "grid", "name": "網と備え", "theme": "生活の基盤と分散"}, {"id": "circle", "name": "輪と分け前", "theme": "相互扶助と決め方"}, {"id": "breath", "name": "息と門番", "theme": "注意、時間、無常"}], "cards": [{"id": "01", "suit": "soil", "title": "庭師", "essence": "支配するのではなく、世話をする。", "image": "朝の光が入る窓辺。透明な容器に稲の苗が数本。じょうろを持つ手だけが画面に入り、足元には摘んだ枯れ葉が小さく積まれている。", "question": "いま自分が世話をしているものは何か。放っておけば荒れると知っていて、手を入れていないものは何か。", "month": "生きものを一つだけ決めて世話をする。鉢でも、ベランダの土でも、近所の木の落ち葉でもよい。収穫や見栄えは目当てにせず、手を入れた日に気づいたことを一行書く。水やりを忘れた日があっても、記録を責める材料にしない。", "year": "この一年、世話を支えていたのは必要か、楽しみか、人との関係かを振り返る。次の一年は、一人の鉢から、誰かと一緒に世話をする場所へ一歩近づく。共同の庭、地域の清掃、知人の畑の手伝いなど、通える範囲で一つ訪ねてみる。", "shadow": "世話が義務になり、枯らした自分を責めはじめたら偏りの合図。やり方を自分で決められない世話や、失敗が暮らしを脅かす世話は、楽しみではなくきつい仕事になる。規模を小さく戻し、やめてもよいことを確かめる。", "sources": [{"slug": "musk-gardening-futures", "learning": "ソーラーパンクの宣言は人を「支配者ではなく庭師」と呼ぶ。筆者は、同じ野菜づくりでも、生活がかかっているか、やり方を自分で決められるかで、趣味にもきつい仕事にもなると書く。", "title": "仕事が家庭菜園のようになるとき — マスクの比喩と、弟が始めたコンテナ農場"}, {"slug": "solarpunk-introduction", "learning": "窓辺の小さな菜園も大きな栽培設備も、誰かが手を入れて保っている。完成した日の絵に、十年後の手入れは写らない。", "title": "ソーラーパンク入門 — 緑の未来を、暮らしの仕組みから考える"}, {"slug": "deep-utopia-and-solarpunk", "learning": "筆者は共同の庭の仮の例から、いまの手仕事や世話の多くは、必要と楽しさと関係が混ざったものだと考える。", "title": "Nick Bostrom『Deep Utopia』を読む — 「解決した世界」に残る意味と選択"}]}, {"id": "02", "suit": "soil", "title": "千回洗うコップ", "essence": "つくるのは一度、保つのは毎日。", "image": "夕方の流し。水切りに伏せた一つのコップ。奥の棚に、繕った布巾と、油を差したばかりの蝶番。", "question": "自分の暮らしを支えている維持の仕事を、誰がしているか。自分はどれを引き受け、どれを見ていないか。", "month": "壊れたものか調子の悪いものを一つ選び、自分で直すか、直せる人や場所を探す。直せなかった場合は、足りなかったのが部品か、知識か、道具か、そもそも直せない設計かを書き留める。直らなくても、それが分かれば十分とする。", "year": "修理や手入れの技能を一つ、人から教わったか、人に渡したかを振り返る。次の一年は、直す場に身を置く。修理の集まりや道具の貸し借りが近くにあれば通い、なければ友人と持ち寄って直す日を一度つくってみる。", "shadow": "何でも一人で直そうと抱え込む。古いものを使い続けることを正しさの証にして、買い替える人を裁く。使うあいだの電気や水の消費が大きい製品は、替えたほうがよい場合もある。ものごとに確かめる。", "sources": [{"slug": "bullshit-jobs-meritocracy-and-ai", "learning": "Graeberは講演で、ものをつくることは仕事のごく一部で、大半は世話と維持だと述べた。コップは一度つくれば済むが、千回洗う、という言い方をしている。", "title": "意味のない仕事から、なぜ降りられないのか — グレーバー、能力主義、AI時代の労働"}, {"slug": "solarpunk-introduction", "learning": "Repair Caféは、壊れたものを持ち寄り、技能を持つボランティアと一緒に直す場で、修理を通じて知識を受け渡すと運営団体は説明している。", "title": "ソーラーパンク入門 — 緑の未来を、暮らしの仕組みから考える"}, {"slug": "less-is-more-and-more-from-less", "learning": "McAfeeは、30年前の洗濯機は処分したほうがよいと答えた。筆者は、寿命を延ばすことがいつも環境によいとは限らず、製品ごとに確かめる必要があるとする。", "title": "『Less is More』と『More from Less』 — 減らすのは成長か、資源か。AIによる効率化の成果はどこへ向かうか"}]}, {"id": "03", "suit": "soil", "title": "さびの色", "essence": "時間の跡を、欠点ではなく色合いとして見る。", "image": "縁の欠けた湯のみと、使い込んで艶の出た木の柄の道具。後ろの壁に日焼けの跡。華やかなものは何もなく、光だけがていねいに当たっている。", "question": "買い替えたいと思っているものは、壊れているのか、古びて見えるだけか。", "month": "何かを新しく買う前に、一度だけ「すでにあるもので足りるか」を確かめる。足りなければ買ってよい。あわせて、長く使っているものを一つ選び、傷や色の変化がいつ、どうしてついたのかを思い出しながら眺める。", "year": "この一年で控えたことのうち、自分で選び取った簡素はどれで、強いられた不足はどれだったかを分ける。前者は続ける。後者は美しいと言わず、収入、時間、住まいといった条件の問題として、変えられる部分を探す。", "shadow": "貧しさや我慢を「わび」と呼んで美化する。自分の好みとしての簡素を、他人に勧める道徳にする。古びたものを集めること自体が新しい消費になる。選べない不足は、味わいではなく条件の問題として見る。", "sources": [{"slug": "wabi-sabi-impermanence-solarpunk", "learning": "去来は「さびは句の色」と述べ、題材ではなく性質だと説明した。筆者はそこから、時間の跡を色合いとして見れば、使い続けることが我慢ではなく味わいになりうると読む（筆者の仮説）。", "title": "侘び、寂び、無常 — 朽ちるものを見る目は、未来をつくる思想と両立するか"}, {"slug": "wabi-sabi-impermanence-solarpunk", "learning": "わびは選び取った簡素であり、選べない貧しさをそう呼べば、強いられた不足を美の名で覆うことになる、と記事は注意している。", "title": "侘び、寂び、無常 — 朽ちるものを見る目は、未来をつくる思想と両立するか"}]}, {"id": "04", "suit": "soil", "title": "支えの地図", "essence": "風景の美しさより先に、何に支えられているかを見る。", "image": "上から見た小さな町の手描きの地図。家から店、駅、水源、送電線へ細い線が伸び、線の途中に、運ぶ人と掃除する人の小さな姿が描き込まれている。", "question": "今日使った電気、水、食べ物はどこから来て、ごみはどこへ行ったか。車を使えない人は、この町でどう暮らしているか。", "month": "近所の一か所（駅、図書館、商店街、公園）を歩き、五つの問いで眺める。どう暮らせるか。何に支えられているか。誰に開かれているか。どう維持しているか。どう変えていけるか。答えが分からない問いは、分からないまま持ち帰る。", "year": "暮らしを支えるもののうち、遠すぎる、仕組みが見えないと感じたものを一つ選ぶ。次の一年は、その支えに一歩近づく。地元でつくる人から買う、施設の見学に行く、自治体の計画や説明会に目を通すなど、知ることから始める。", "shadow": "自然の近くに住めば負荷が小さいと思い込む。緑の量や見た目で判断する。歩ける道や近くの店がないことを、個人の心がけの問題にしてしまう。見た目の魅力と、移動やエネルギーの実際は、別々に確かめる。", "sources": [{"slug": "solarpunk-introduction", "learning": "記事は未来像を読む五つの問いを挙げ、近所の駅や図書館、商店街にも当てはまると書く。DamiLeeは「自然の中に住む」ことと「自然への負荷が小さい」ことは同じではないと指摘する。", "title": "ソーラーパンク入門 — 緑の未来を、暮らしの仕組みから考える"}, {"slug": "kazenotani-and-matagi-drive", "learning": "安宅和人は、尖った技術を入れれば谷ができることはまずないと述べ、何を解決したいのかを先に見極めるよう求める。", "title": "「風の谷」とマタギドライヴ — 都市の外の暮らしと、計算機に囲まれた暮らしを考える二つの構想"}]}, {"id": "05", "suit": "grid", "title": "つながったままの備え", "essence": "切り離すためではなく、止まっても続けるために。", "image": "屋根の小さな太陽光パネルと、その向こうへ続く送電線。室内に水のボトルと手回しの灯り。窓は開いていて、隣の家の明かりが見える。", "question": "電気、水、通信、食べ物のうち、三日止まったら最初に困るのはどれか。そのとき声をかけられる人は誰か。", "month": "備えを一つだけ足す（飲み水、灯り、充電の手段、紙に書いた連絡先）。あわせて、近所の人か友人の一人と、電気や通信が止まったときにどうするかを一度話す。物を増やすより、声をかけ合える相手を一人確かめることを先にする。", "year": "備えは選べる道を増やしたか、不安を増やしただけかを振り返る。次の一年は、一人の備えを数人の備えへ広げる。地域の防災訓練に出る、道具や場所を融通し合える相手を増やすなど、すでにある仕組みを使いながら足していく。", "shadow": "備えが買い込みと孤立に変わる。網から抜けること自体を目的にして、網に残る人の負担を見ない。備えは、外とつながったまま、止まっても続けるためのもの。不安で物が増えはじめたら、人と話すほうへ戻る。", "sources": [{"slug": "solarpunk-and-dacc", "learning": "Flynnは送電網をなくせとは言わず、地域に備えがあれば、供給を止めようとする相手に有利に交渉できると書いた。筆者は分散を、外とつながったまま選択肢を失わないための備えとして読む。", "title": "ソーラーパンクとd/acc — 分散した共同体が、暮らしを自分たちで決め続けるための技術と制度"}, {"slug": "kazenotani-and-matagi-drive", "learning": "安宅和人は送電網からの独立に慎重である。筆者は、まばらに独立する人が増えれば、網に残る人の負担が重くなると読む。", "title": "「風の谷」とマタギドライヴ — 都市の外の暮らしと、計算機に囲まれた暮らしを考える二つの構想"}, {"slug": "solarpunk-introduction", "learning": "Low-tech Magazineの太陽光で動くサイトは、曇天が続けば止まる設計で、使う量と、いつでも使えるという前提を見直す例として紹介されている。止められないサービスもある、と記事は断っている。", "title": "ソーラーパンク入門 — 緑の未来を、暮らしの仕組みから考える"}]}, {"id": "06", "suit": "grid", "title": "誰が止められるか", "essence": "設備が分かれていても、決める力が分かれているとは限らない。", "image": "円卓の中央に一つの大きなスイッチ。まわりに何脚もの椅子があり、いくつかは空いている。卓の下から細い線が一本、遠くの建物へ伸びている。", "question": "自分が頼っている道具や場について、誰が持ち、誰が止められ、どこに異議を言えるか。", "month": "よく使うサービスか共同の場を一つ選び、四つを調べる。設計や決まりは公開されているか。誰の持ち物か。利益は誰に渡るか。維持の費用と手間は誰が負っているか。分からなかった項目は、分からないと書いておく。", "year": "自分が関わる集まりや場で、決め方に一度でも口を出せたかを振り返る。次の一年は、利用者として使うだけの場のうち一つで、運営に少し関わる。総会に出る、意見を届ける、当番を一度引き受ける、といった小さな関わりでよい。", "shadow": "小さくて地域のものなら公正だと思い込む。分散という言葉に満足して、所有と手続きを確かめない。逆に、調べるほど誰も信じられなくなる。確かめるのは疑うためではなく、関われる場所を見つけるため。", "sources": [{"slug": "solarpunk-and-dacc", "learning": "Vitalik Buterinは、技術の形は分散していても力が集まった例を挙げ、集中を戻すには人が意図して働きかける必要があると述べる。小さく地域に根ざしているだけでは公正にならない、とも指摘している。", "title": "ソーラーパンクとd/acc — 分散した共同体が、暮らしを自分たちで決め続けるための技術と制度"}, {"slug": "solarpunk-and-dacc", "learning": "筆者は五十世帯の共同の太陽光という仮の例で、誰のものか、足りない日に誰への供給を先に止めるか、誰が遠隔で止められるか、どこに異議を言うかは、設備を置いただけでは決まらないと書く。", "title": "ソーラーパンクとd/acc — 分散した共同体が、暮らしを自分たちで決め続けるための技術と制度"}, {"slug": "plurality", "learning": "記事は道具を読む問いとして、結果がどう使われるか、過程を確かめられるかを挙げ、道具は置いただけでは働かないとまとめる。", "title": "プルラリティ入門 — 違いをなくさずに、一緒に決めるための技術"}]}, {"id": "07", "suit": "grid", "title": "降りられる足場", "essence": "足りないのは勇気ではなく、支えかもしれない。", "image": "高い梯子の途中に立つ人。地面では何人かの手が板を差し出し、足場が組まれつつある。梯子の上は雲に隠れている。", "question": "いまの働き方や評価から一歩降りるとしたら、何が支えになり、何を失うか。", "month": "暮らしに必要なもののうち、賃金を通さずに手に入っているものを一つ見つけて書く。図書館、歩いて行ける場所、分けてもらった野菜、頼れる人など。増やせそうなものがあれば、一つだけ試す。収入を減らす話ではなく、支えを数える月にする。", "year": "暮らしの糧、借り、肩書き、蓄えの四つを、決断のためではなく地図として眺め直す。次の一年は、支えを一本増やす方向を探す。仕事や住まいの大きな変更は、家計と家族の事情を知る人と、事実を並べて話してから考える。", "shadow": "降りられない自分や他人を責める。条件を確かめないまま勢いで降りる。降りること自体が新しい競争になる。辞めないのは、気づきが足りないからとは限らない。先に確かめるのは、降りたあとの暮らしを支えるもの。", "sources": [{"slug": "bullshit-jobs-meritocracy-and-ai", "learning": "筆者は降りにくい理由を四つ挙げる（暮らしに必要なものが労働の収入に結びつく、借金、仕事が自分を説明する言葉になっている、資産がない）。辞めないのは気づきが足りないからではなく、辞めたあとの暮らしを支えるものがないからだと考え、降りても暮らせる条件を先に用意する方向を並べる。", "title": "意味のない仕事から、なぜ降りられないのか — グレーバー、能力主義、AI時代の労働"}, {"slug": "quantification-and-postcapitalism", "learning": "筆者は、数字に動かされにくくする条件の一つに、物差しから降りても暮らしていけることを加えている。", "title": "数字に踊らされる社会から、どう抜け出すか — 小野龍光の「数字の怖さ」と深井龍之介の「定量化ドグマ」"}, {"slug": "engineers-after-layoffs-and-ai", "learning": "記事が確認できた事例では、別の職へ移る費用を負ったのは本人の貯金と家族だった。筆者は、個人の準備では埋まらない部分があるとまとめる。", "title": "レイオフされたエンジニアは、その後どうしているのか — AI時代のキャリア危機と、世界の当事者たち"}]}, {"id": "08", "suit": "grid", "title": "浮いた時間の行き先", "essence": "速くなった分は、放っておけば仕事に戻っていく。", "image": "砂時計から落ちる砂が途中で三つの小さな器に分かれて注がれている。器のそばに、湯のみ、繕いかけの布、回覧板。", "question": "道具やAIで速く済むようになった時間は、どこへ行ったか。", "month": "早く終わった時間を一度だけ、次の作業に回さず、休むこと、誰かの世話、直すこと、地域の用事のどれかに使う。使えなかった場合は、妨げたのが締め切りか、職場の決まりか、自分の癖かを書く。責めずに、原因だけを見る。", "year": "時間の使い方を決めているのが、自分か、職場の決まりか、収入の必要かを分ける。次の一年は、自分で動かせる部分を一つ、世話や地域の用事に定期的に充てる。動かせない部分については、同じ立場の人と話せる場を探す。", "shadow": "余暇まで成果で埋める。休めないことを意志の弱さにする。休める働き方がなければ、休息は心がけだけでは生まれない。休めない理由が条件の側にあるなら、一人で工夫するより、条件を話し合える相手を探す。", "sources": [{"slug": "less-is-more-and-more-from-less", "learning": "筆者の仮説は、効率化で浮いた分の行き先は技術ではなく制度が決める、というもの。豊かになることと労働時間が減ることは自動的には結びつかず、時間が地域に残れば、世話や修理や地域の決めごとに使えるとする。", "title": "『Less is More』と『More from Less』 — 減らすのは成長か、資源か。AIによる効率化の成果はどこへ向かうか"}, {"slug": "bullshit-jobs-meritocracy-and-ai", "learning": "デンマークの研究では、AIの利用が広がっても、使う人の労働時間に変化は見られなかったと紹介されている。", "title": "意味のない仕事から、なぜ降りられないのか — グレーバー、能力主義、AI時代の労働"}, {"slug": "solarpunk-capitalist-realism-and-spirituality", "learning": "作家Becky Chambersは休息を必需品として描いた。筆者は、休息を神聖と呼ぶなら、休める働き方と一緒に語る必要があるとする。", "title": "ほかの未来を想像できないとき — 『資本主義リアリズム』から読むサイバーパンクと、ソーラーパンクのスピリチュアリティ"}]}, {"id": "09", "suit": "circle", "title": "授かりと分け前", "essence": "見つけた人は、持ち主ではなく届ける人。", "image": "雪の山道を下りてきた人が背の荷をほどき、村の戸口に包みを置いていく。留守の家の前にも一つ。", "question": "最近、自分が受け取ったものは何か。自分が見つけたもののうち、まだ誰にも渡していないものは何か。", "month": "知ったこと、作ったもの、余ったものを一つ、見返りを数えずに誰かに渡す。その場にいなかった人の分も考える。受け取る側になったときは、遠慮せずに受け取り、礼を言う。渡した回数や相手の反応は記録しない。", "year": "もらうことと渡すことの、どちらが苦手だったかを振り返る。次の一年は、分けても減らない知識の共有と、手間や費用のかかる道具や場所の共有を分けて考える。後者は、負担の分け方を先に決めてから、少人数で一つ試す。", "shadow": "与える側に立ち続けて、受け取れなくなる。分かち合いという言葉で、誰かの無償の働きを当てにする。世話や手間を引き受けている人に、時間や対価が返っているかを確かめる。自分が引き受けすぎていないかも見る。", "sources": [{"slug": "kazenotani-and-matagi-drive", "learning": "落合陽一はマタギの作法として、熊は「授かる」もので、その場にいなかった仲間にも分け前があり、見つけた人は持ち主ではなく届ける人だと書く。これは落合の描写で、記事は民俗学に照らした確認をしていない。", "title": "「風の谷」とマタギドライヴ — 都市の外の暮らしと、計算機に囲まれた暮らしを考える二つの構想"}, {"slug": "kazenotani-and-matagi-drive", "learning": "筆者は、この説明が扱うのは主に知識や発見のような複製できるものの分かち合いで、土地や設備を誰が持ち、誰が保つかは別の問いだとする。", "title": "「風の谷」とマタギドライヴ — 都市の外の暮らしと、計算機に囲まれた暮らしを考える二つの構想"}, {"slug": "solarpunk-capitalist-realism-and-spirituality", "learning": "Kropotkinは助け合いを進化の「一つの」要因とした。筆者は、世話を尊い仕事として描くことと、その仕事に時間と対価が用意されていることは別だと書く。", "title": "ほかの未来を想像できないとき — 『資本主義リアリズム』から読むサイバーパンクと、ソーラーパンクのスピリチュアリティ"}]}, {"id": "10", "suit": "circle", "title": "橋の言葉", "essence": "言い負かす一文より、両側がうなずける一文。", "image": "川をはさんで立つ二つの集まり。真ん中に、まだ板が数枚しか渡っていない橋。板を抱えて歩く人が一人。", "question": "意見が割れている相手と、それでも一致している一点は何か。", "month": "意見の合わない話題で一度だけ、反論の前に「ここは同じだと思う」を一つ探して言葉にする。見つからなければ、相手の言い分を、相手がうなずく形で言い直してみる。同意する必要はない。違いは違いのまま残してよい。", "year": "自分がいくつの集まり（家族、仕事、地域、趣味、信仰）に属しているかを数え直す。次の一年は、ふだん交わらない二つの集まりのあいだで、人か言葉を一度つなぐ。合意に至らなかった意見も、消さずに書き留めておく。", "shadow": "合意を急いで、残すべき対立を消す。橋渡し役を引き受けすぎて、自分の意見がなくなる。多くの人の話をよく聞くには、注意と時間がかかる。聞ける量には限りがあると認め、聞く相手と場を選ぶ。", "sources": [{"slug": "plurality", "learning": "Polisは、分かれた集団の両方から賛成を得た意見を目立たせる設計になっている。本は、人がいくつもの集団に同時に属していると述べ、大まかな合意と同じく、多様性と生産的な対立も欠かせないとする。", "title": "プルラリティ入門 — 違いをなくさずに、一緒に決めるための技術"}, {"slug": "plurality", "learning": "本は限界として、多くの人の意見をよく聞くには注意と手間がかかること、言葉が捉えられるのは経験の一部であることを自分で書いている。", "title": "プルラリティ入門 — 違いをなくさずに、一緒に決めるための技術"}]}, {"id": "11", "suit": "circle", "title": "出口のある輪", "essence": "割れても続けられ、合わなければ離れられる。", "image": "焚き火を囲む人の輪。輪は一か所だけ開いていて、そこから小道が外へ続いている。火のそばに、順番に回す木の札。", "question": "自分のいる集まりで、反対を言えるか。抜けたいと言えるか。", "month": "関わっている集まりを一つ選び、もめたときの決め方と、抜け方があるかを確かめる。なければ、小さな約束を一つ提案する。進行役を交代する、決めたことを書き残す、欠席や退会を責めない、といった程度のものでよい。", "year": "この一年で輪に入った人と離れた人、その理由を思い出す。自分に課された負担と、自分で選んだ制約を分ける。次の一年は、続けたい輪を一つ選び、意見が割れたときの手続きを、仲間と一緒に言葉にしておく。", "shadow": "調和を守るために黙る。共生という言葉で、合わない人に合わせることを求める。逆に、少しの摩擦ですぐ離れる。目指すのは対立のない輪ではなく、割れても続けられ、合わなければ離れられる輪。", "sources": [{"slug": "solarpunk-capitalist-realism-and-spirituality", "learning": "筆者は共生の条件に、対立と退出の余地を挙げる。Ostromの原則には、安く速く争いを解決できる場が入っている。記事は、調和や共生の言葉が人々を一つにまとめる目的に使われた歴史にもふれている。", "title": "ほかの未来を想像できないとき — 『資本主義リアリズム』から読むサイバーパンクと、ソーラーパンクのスピリチュアリティ"}, {"slug": "deep-utopia-and-solarpunk", "learning": "筆者は、本人が選ぶ制約と、他人に課す負担を分けて考える。", "title": "Nick Bostrom『Deep Utopia』を読む — 「解決した世界」に残る意味と選択"}, {"slug": "solarpunk-introduction", "learning": "Solarpunk Story Circlesの手引きは、定期的に集まり、進行役を交代するモデルを示している。", "title": "ソーラーパンク入門 — 緑の未来を、暮らしの仕組みから考える"}]}, {"id": "12", "suit": "circle", "title": "土地の数人", "essence": "場所は、誰の任期よりも長い時間でできている。", "image": "谷あいの古い道。土地の人が先に立ち、訪れた人が半歩後ろを歩く。道ばたに、世代の違う手で積まれた石垣。", "question": "関わりたい土地や場で、すでに長く手を入れてきたのは誰か。自分はそこで何を聞いたか。", "month": "住んでいる場所か通っている場所で、長く続いている営み（祭り、清掃、店、畑）を一つ訪ね、手伝うか、話を聞く。提案はしない月にする。誰がどれくらいの年月、何を保ってきたのかを聞いて、覚えておく。", "year": "自分の一生より長く続いてほしいものを一つ挙げる。次の一年は、その営みに通い続ける。担い手のうち顔と名前の分かる人を数人に増やし、頼まれた小さな役を一つ引き受ける。住む場所を変える話は急がない。", "shadow": "理想の共同体を探して場所を渡り歩く。よそから答えを持ち込む。長くいるというだけで、外から来る人を閉め出す。小さな共同体にも、医療や移動や働く場の課題がある。憧れと暮らしの条件は分けて見る。", "sources": [{"slug": "kazenotani-and-matagi-drive", "learning": "安宅和人は担い手の条件として、その土地で育ち、外の目を持つ比較的若い人が4〜5人いることを挙げ、よそから土足で踏み込むのは失礼だと述べる。谷づくりには数十年から100年かかるとも言う。", "title": "「風の谷」とマタギドライヴ — 都市の外の暮らしと、計算機に囲まれた暮らしを考える二つの構想"}, {"slug": "wabi-sabi-impermanence-solarpunk", "learning": "Flynnは、目指すのは後に続く世代のために暮らしを良くすることだと書いた。筆者は、自分の代で終わらない仕事を引き受けるには、自分が続かないことを受け入れている必要があると読む。", "title": "侘び、寂び、無常 — 朽ちるものを見る目は、未来をつくる思想と両立するか"}, {"slug": "solarpunk-introduction", "learning": "小さな共同体では関係を築きやすくても、食料、医療、移動、働く場所の確保が課題になる、と記事は書く。", "title": "ソーラーパンク入門 — 緑の未来を、暮らしの仕組みから考える"}]}, {"id": "13", "suit": "breath", "title": "門番", "essence": "注意はいつも、どこかに向いている。", "image": "六つの門のある小さな城。門はどれも開いている。灯りを持った門番が一人立ち、追い返しもせず、ただ出入りを見ている。", "question": "いま、注意はどこに向いているか。それは自分で選んだ向きか、繰り返しでできた癖か。", "month": "一日に一度、決まった合図（湯を沸かす、扉を開ける）で「いまどこを見ていたか」を確かめる。止めようとせず、気づくだけにする。あわせて、何度も開いてしまう画面を一つ、開きにくい場所へ移す。癖は道具の側からも変えられる。", "year": "この一年、注意の癖をつくっていた制度や道具は何だったかを振り返る。次の一年は、座る、歩く、唱える、写すなど、自分に合う稽古の形を、縁のある伝統や教える人のもとで確かめる。一人で続けるより、共に行う場を探す。", "shadow": "心を整えることが、競争に耐えるための燃料になる。苦しさの原因を自分の内側だけに探す。気づけなかった自分を責める。働き方や道具の側に原因があるなら、整えるだけでなく、条件のほうを人と話す。", "sources": [{"slug": "attention-and-awareness", "learning": "経典は念を、六つの門を守る門番にたとえる。記事が読んだ上座部の分類では、心を対象に向けるはたらきは欲や怒りのときにも働いていて、向きを見失わないはたらきは別に数えられる。", "title": "同じ一日の、どこに重みを置くか — 「Attention Is All You Need」と仏教の気づき"}, {"slug": "attention-and-awareness", "learning": "筆者は、注意の癖は繰り返しでつくられ、その繰り返しの中身は、数字で評価する制度や、何度も開きたくなる道具も決めていると読む。", "title": "同じ一日の、どこに重みを置くか — 「Attention Is All You Need」と仏教の気づき"}, {"slug": "wabi-sabi-impermanence-solarpunk", "learning": "Purserは、マインドフルネスが成績を高める技法として売られ、ストレスの原因になった条件は変わらないと批判する。Fisherは、原因が本人の内側に探されることを「ストレスの私有化」と呼んだ。", "title": "侘び、寂び、無常 — 朽ちるものを見る目は、未来をつくる思想と両立するか"}]}, {"id": "14", "suit": "breath", "title": "天井と挨拶", "essence": "感謝は起こすものではなく、起きるもの。", "image": "朝、布団から見上げた木の天井。開いた戸の向こうで、通りがかりの人が軽く手を上げている。", "question": "今日、すでにそこにあって、気づいていなかったものは何か。", "month": "寝る前に、その日のささやかなことを一つ思い出す。天井があった、挨拶された、息ができている、という程度のことでよい。感謝しようとはしない。何も浮かばない日や、つらさしか浮かばない日は、そのままにして眠る。", "year": "欲しいものが増えたか減ったか、足るを知ることが自分で選んだ簡素になっているかを振り返る。次の一年は、受けた恩を一つ、相手に言葉で伝えるか、別の誰かへ手渡す。気づいたことを、人との関わりへつなげる。", "shadow": "感謝できない自分を責める。苦しい状況にある人に、自分を含めて「足るを知れ」と説く。喜びを数えはじめる。足るを知るは、もとは修行する人の心得。暮らしの条件が苦しいときは、条件のほうを先に見る。", "sources": [{"slug": "attention-and-awareness", "learning": "小野龍光さんは、天井がある、挨拶してくれる人がいる、呼吸ができている、というささやかなことに注意が向くと、そこに感謝が生まれると語る。経典は、後悔のない人に喜びが生じるのは自然なことだと説く。初期の経典には、恩を知ることを人の徳として説く箇所もある。", "title": "同じ一日の、どこに重みを置くか — 「Attention Is All You Need」と仏教の気づき"}, {"slug": "attention-and-awareness", "learning": "筆者は、これを感謝そのものを課題にしない言い方だと読む。気づけば感謝が生まれ、感謝すれば解放される、という一本の道は、記事が読んだ経典には書かれていない。", "title": "同じ一日の、どこに重みを置くか — 「Attention Is All You Need」と仏教の気づき"}, {"slug": "solarpunk-capitalist-realism-and-spirituality", "learning": "少欲知足はもとは修行する人の心得で、暮らしの苦しい人に向かって説けば我慢の勧めになる、と記事は書く。", "title": "ほかの未来を想像できないとき — 『資本主義リアリズム』から読むサイバーパンクと、ソーラーパンクのスピリチュアリティ"}]}, {"id": "15", "suit": "breath", "title": "もう一本の物差し", "essence": "点ではなく、方角。", "image": "机の上に、長さも目盛りも違う物差しが数本。その横に、目盛りのない方位磁針。窓の外に、ほっとした顔の人。", "question": "いま追っている数字は、もとの目的に役立っているか。振り返って、やめることができるか。", "month": "気にしている数字を一つ選び、ひと月だけ、見る回数を減らすか表示を隠す。数字そのものは捨てない。代わりに、顔の見える反応（かけられた言葉、相手の表情）を一つ覚えておく。ひと月後、戻すかどうかを自分で決める。", "year": "一年の振り返りを、達成した数ではなく「どの方角へ歩いたか」で書く。数字にならない判断を一つ、理由を言葉で残し、翌年に確かめる。次の一年は、仕事の評価とは別の物差しで付き合える人や場を、一つ持つ。", "shadow": "数字を悪者にして、確かめることまでやめる。「役に立てたか」という新しい物差しにとらわれる。このカードの実践を回数で数えはじめる。数字は状態を知る道具として残し、やめられるかどうかだけを問う。", "sources": [{"slug": "quantification-and-postcapitalism", "learning": "小野龍光さんは、手段だった数字がいつのまにか目的に入れ替わっていたと振り返り、いまは点としての目標を持たず、進む方角だけを決めていると語る。深井龍之介さんは、指標を捨てるのではなく、もう一つ増やすことを提案する。", "title": "数字に踊らされる社会から、どう抜け出すか — 小野龍光の「数字の怖さ」と深井龍之介の「定量化ドグマ」"}, {"slug": "quantification-and-postcapitalism", "learning": "哲学者Nguyenは、数字を使うことと数字に乗っ取られることを分ける。記事はその区別を、その数字が本当の目的に役立っているかを振り返って、やめることができるか、という問いにまとめる。", "title": "数字に踊らされる社会から、どう抜け出すか — 小野龍光の「数字の怖さ」と深井龍之介の「定量化ドグマ」"}, {"slug": "quantification-and-postcapitalism", "learning": "小野さんは「役に立つ」もとらわれになりうると認めている。筆者は、数字で届く反応と顔の見える反応の両方を持つことを、身近な方法として挙げる。", "title": "数字に踊らされる社会から、どう抜け出すか — 小野龍光の「数字の怖さ」と深井龍之介の「定量化ドグマ」"}]}, {"id": "16", "suit": "breath", "title": "春の夜の夢", "essence": "続かないと知っているから、世話をする。", "image": "散りはじめた白い花の木の下で、一人が苗木を植え、もう一人が割れた器を土に還している。遠くに、傾いた立派な門。", "question": "この一年で終わったものは何か。それを見送ったか。続けるものは何か。", "month": "終わったことか手放すものを一つ決めて、小さく区切りをつける。片づける、礼を言う、書いて閉じる、など。次に、続けたいものを一つ選び、手を入れる。終わらせることと続けることを、同じ月のなかで一つずつ行う。", "year": "引いたカードを並べ、何が続き、何が終わったかを見分ける。変えられないと思っていたことのうち、理由があって起きていること、つまり変えられるかもしれないことを一つ選ぶ。次の一年の方角を一つの言葉にし、一緒に歩く人を一人思い浮かべる。", "shadow": "「どうせ移ろう」と眺めて、変えられることまで手放す。他人の喪失や災害を美しいと言う。受け入れるのは、いまいる地点。そこから先は歩いてよい。理由のある不正まで、移ろいとして見送らない。", "sources": [{"slug": "wabi-sabi-impermanence-solarpunk", "learning": "『平家物語』の冒頭は、権力者が滅びた理由として、諫めを聞かず民の嘆きを知らなかったことを書く。筆者は、無常は現状を支える言葉にも、ほかの未来を考える余地を開く言葉にもなりうると読む。", "title": "侘び、寂び、無常 — 朽ちるものを見る目は、未来をつくる思想と両立するか"}, {"slug": "wabi-sabi-impermanence-solarpunk", "learning": "筆者の仮説は、何が続き何が終わるかを見分け、終わるものを弔い、続けるものの世話をする目が要る、というもの。向かう先が加われば、受け入れることは歩き始める場所を確かめることになるとする。災害や喪失を美しいと言わない、という注意も書かれている。", "title": "侘び、寂び、無常 — 朽ちるものを見る目は、未来をつくる思想と両立するか"}, {"slug": "solarpunk-capitalist-realism-and-spirituality", "learning": "Fisherは、ほかにやりようがあるとは思えないという感覚を「資本主義リアリズム」と呼んだ。", "title": "ほかの未来を想像できないとき — 『資本主義リアリズム』から読むサイバーパンクと、ソーラーパンクのスピリチュアリティ"}]}], "roadmap": [{"period": "最初のひと月", "title": "一枚だけ引く", "text": "1枚引いて、問いを持ち歩き、月の実践を一度試します。記録は一行で足ります。合わなければ引き直してかまいません。はじめは一人でできるカードが向いています。", "cardIds": ["01", "03", "13", "14"]}, {"period": "数か月", "title": "四つの組をひとめぐりする", "text": "月ごとに違う組から引き、土と手、網と備え、輪と分け前、息と門番を一度ずつ通ります。話す、渡す、訪ねるといった、相手のいる実践を一つ混ぜます。偏りの気づきに当たったら、別の組へ移ります。", "cardIds": ["02", "04", "05", "09", "10"]}, {"period": "半年〜1年", "title": "一人の実践を、誰かとの実践にする", "text": "続いたものを一つ選び、同じことを誰かと行います。持ち寄って直す、備えを話し合う、長く続く営みに通う、など。年の終わりに16番を開き、引いたカードの「年の視点」を読んで、次の一年の方角を一つ決めます。", "cardIds": ["08", "12", "15", "16"]}, {"period": "2〜3年", "title": "場を一つ、仲間と保つ", "text": "通い続けた場や輪のうち一つで、誰のものか、どう決めるか、費用と手間をどう分けるか、どう抜けられるかを仲間と言葉にします。共同の庭、道具の共有、備えの連絡網など、小さな規模で十分です。仕事や住まいの大きな変更は、ここまでの経験と、家計や家族の事情を並べてから考えることで、このカードは決めません。", "cardIds": ["01", "06", "07", "11", "12"]}]}</script>

function show(view){document.querySelectorAll('main>section').forEach(el=>el.hidden=el.id!==view);document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)))}
function render(i,announce=false){selected=i;const c=cards[i];document.getElementById('card-front').innerHTML=front(i);document.getElementById('counter').textContent=roman[i]+' / '+cards.length;document.getElementById('card-detail').innerHTML='<div class="kicker">'+['土と手','網と備え','輪と分け前','息と門番'][Math.floor(i/4)]+' · '+roman[i]+' · '+e(c.title)+'</div><h2 class="question">'+e(c.question)+'</h2><section class="practice"><h3>今月、試すこと <span>THIS MONTH</span></h3><p>'+e(c.month)+'</p></section><section class="practice"><h3>一年かけて育てること <span>OVER A YEAR</span></h3><p>'+e(c.year)+'</p></section><div class="shadow"><strong>偏りに気づいたら</strong>'+e(c.shadow)+'</div><details><summary>このカードにつながる記事</summary><ul>'+c.sources.map(s=>'<li><a target="_blank" rel="noopener" href="https://70ki8suda.com/blog/'+encodeURIComponent(s.slug)+'">'+e(s.title||s.slug)+'</a><p>'+e(s.learning)+'</p></li>').join('')+'</ul></details>';try{localStorage.setItem('solarpunk-life-card',String(i))}catch{}if(announce)document.getElementById('status').textContent=c.title+'のカードを開きました';}
document.getElementById('intro').textContent=data.intro.split('。').slice(0,2).join('。')+'。';document.getElementById('deck-title').textContent=data.title.split(' — ')[0]||'暮らしのアルカナ';document.title=data.title||'暮らしのアルカナ';
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.view)));
document.getElementById('draw').addEventListener('click',()=>{const n=cards.length;render(n<2?0:(selected+1+Math.floor(Math.random()*(n-1)))%n,true)});
document.getElementById('previous').addEventListener('click',()=>render((selected+cards.length-1)%cards.length,true));document.getElementById('next').addEventListener('click',()=>render((selected+1)%cards.length,true));
document.getElementById('grid').innerHTML=cards.map((c,i)=>'<button class="mini" type="button" data-card="'+i+'" aria-label="'+e(c.title)+'を読む">'+front(i)+'<div class="caption">'+e(c.question)+'</div></button>').join('');
document.getElementById('year').innerHTML="<div class=\"kicker\">A direction, not a deadline</div><h2>月と年の道すじ</h2><p class=\"lead\">一枚を選び、小さく試し、暮らしに合うものを残す。時期は目安です。いま必要なところから始められます。</p><article class=\"phase\"><div class=\"label\">最初のひと月</div><div><h3>一枚だけ引く</h3><p>1枚引いて、問いを持ち歩き、月の実践を一度試します。記録は一行で足ります。合わなければ引き直してかまいません。はじめは一人でできるカードが向いています。</p><div class=\"choice\"><button type=\"button\" data-card=\"0\">庭師 ↗</button><button type=\"button\" data-card=\"2\">さびの色 ↗</button><button type=\"button\" data-card=\"12\">門番 ↗</button><button type=\"button\" data-card=\"13\">天井と挨拶 ↗</button></div></div></article><article class=\"phase\"><div class=\"label\">数か月</div><div><h3>四つの組をひとめぐりする</h3><p>月ごとに違う組から引き、土と手、網と備え、輪と分け前、息と門番を一度ずつ通ります。話す、渡す、訪ねるといった、相手のいる実践を一つ混ぜます。偏りの気づきに当たったら、別の組へ移ります。</p><div class=\"choice\"><button type=\"button\" data-card=\"1\">千回洗うコップ ↗</button><button type=\"button\" data-card=\"3\">支えの地図 ↗</button><button type=\"button\" data-card=\"4\">つながったままの備え ↗</button><button type=\"button\" data-card=\"8\">授かりと分け前 ↗</button><button type=\"button\" data-card=\"9\">橋の言葉 ↗</button></div></div></article><article class=\"phase\"><div class=\"label\">半年〜1年</div><div><h3>一人の実践を、誰かとの実践にする</h3><p>続いたものを一つ選び、同じことを誰かと行います。持ち寄って直す、備えを話し合う、長く続く営みに通う、など。年の終わりに16番を開き、引いたカードの「年の視点」を読んで、次の一年の方角を一つ決めます。</p><div class=\"choice\"><button type=\"button\" data-card=\"7\">浮いた時間の行き先 ↗</button><button type=\"button\" data-card=\"11\">土地の数人 ↗</button><button type=\"button\" data-card=\"14\">もう一本の物差し ↗</button><button type=\"button\" data-card=\"15\">春の夜の夢 ↗</button></div></div></article><article class=\"phase\"><div class=\"label\">2〜3年</div><div><h3>場を一つ、仲間と保つ</h3><p>通い続けた場や輪のうち一つで、誰のものか、どう決めるか、費用と手間をどう分けるか、どう抜けられるかを仲間と言葉にします。共同の庭、道具の共有、備えの連絡網など、小さな規模で十分です。仕事や住まいの大きな変更は、ここまでの経験と、家計や家族の事情を並べてから考えることで、このカードは決めません。</p><div class=\"choice\"><button type=\"button\" data-card=\"0\">庭師 ↗</button><button type=\"button\" data-card=\"5\">誰が止められるか ↗</button><button type=\"button\" data-card=\"6\">降りられる足場 ↗</button><button type=\"button\" data-card=\"10\">出口のある輪 ↗</button><button type=\"button\" data-card=\"11\">土地の数人 ↗</button></div></div></article>";
document.querySelectorAll('[data-card]').forEach(b=>b.addEventListener('click',()=>{render(Number(b.dataset.card),true);show('reading');document.getElementById('draw').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})}));
document.getElementById('print').addEventListener('click',()=>window.print());
document.getElementById('print-deck').innerHTML=cards.map((c,i)=>'<article class="print-card"><div>'+art(i)+'<p class="print-essence">'+e(c.essence)+'</p></div><div><h2>'+roman[i]+' '+e(c.title)+'</h2><p>'+e(c.question)+'</p><h3>今月、試すこと</h3><p>'+e(c.month)+'</p><h3>一年かけて育てること</h3><p>'+e(c.year)+'</p><h3>偏りに気づいたら</h3><p>'+e(c.shadow)+'</p><p class="print-sources">'+c.sources.map(s=>'70ki8suda.com/blog/'+e(s.slug)).join('<br>')+'</p></div></article>').join('');render(selected);
})();
</script></body></html>
